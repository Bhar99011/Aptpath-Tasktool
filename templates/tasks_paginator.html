<style>
    .paginator {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-top: 20px;
        padding: 10px;
        font-family: Arial, sans-serif;
    }
    
    .paginator a {
        text-decoration: none;
        color: #007bff;
        font-weight: bold;
        padding: 8px 12px;
        border: 1px solid #007bff;
        border-radius: 5px;
        transition: all 0.3s ease-in-out;
    }
    
    .paginator a:hover {
        background-color: #007bff;
        color: white;
    }
    
    .paginator span {
        font-size: 16px;
        font-weight: bold;
        padding: 8px 12px;
        background: #f8f9fa;
        border: 1px solid #ddd;
        border-radius: 5px;
    }
    
    .paginator a[disabled] {
        pointer-events: none;
        color: #ccc;
        border-color: #ccc;
    }
    
    
    </style>


<div class="paginator">

    {% if tasks.has_previous %}
    <a href="?page=1" class="btn btn-outline-primary">First</a>
    <a href="?page={{tasks.previous_page_number}}" class="btn btn-outline-primary" >Previous</a>
    {% endif %}

    <span> {{tasks.number}} of {{tasks.paginator.num_pages}}</span>

    {% if tasks.has_next %}
    <a href="?page={{tasks.next_page_number}}" class="btn btn-outline-primary" >Next</a>
    <a href="?page={{tasks.paginator.num_pages}}" class="btn btn-outline-primary" >Last</a>
    {% endif %}
</div>
