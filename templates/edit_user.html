




   
<div id="popup{{ user.id }}" class="popup">
    <div class="popup-content">
        <h2>Edit User Details</h2>
        <form method="POST" action="{% url 'user_edit' user.id %}">
            {% csrf_token %}
            <label for="user_name">Username:</label><br>
            <input type="text" id="user_name" name="user_name" value="{{ user.user_name }}" readonly><br><br>
            <label for="email{{ user.id }}">Email:</label><br>
            <input type="email" id="email{{ user.id }}" name="email" value="{{ user.email }}" required><br><br>
            <button type="submit" class="button-css">Update</button>
        </form>
        <!-- "Close" link resets the URL fragment -->
        <a class="close-btn" href="#">Close</a>
    </div>
</div>


<!-- CSS for the CSS-only popup -->
<style>
    /* Basic styling for the popup modal */
    .popup {
        visibility: hidden;
        opacity: 0;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        padding: 20px;
        background: white;
        box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        border-radius: 8px;
        z-index: 1000;
        transition: opacity 0.3s ease;
    }
    .popup:target {
        visibility: visible;
        opacity: 3;
    }
    .popup-content {
        position: relative;
    }
    .close-btn {
        display: inline-block;
        margin-top: 10px;
        padding: 5px 10px;
        background: red;
        color: white;
        text-decoration: none;
        border-radius: 5px;
    }
    /* Optional: overlay styling */
    .popup:target::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(24, 21, 247, 0.105);
        z-index: -1;
    }
</style>
