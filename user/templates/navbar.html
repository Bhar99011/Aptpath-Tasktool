<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    .btn-danger {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background-color: #c62828;
        }
  </style>
  <title>Task-tool Management</title>
  <!-- Include Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <!-- Toggle button to open offcanvas on the left -->
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasDarkNavbar" aria-controls="offcanvasDarkNavbar" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <!-- Navbar Title beside the toggle button -->
      {% if user.role.name == 'User' %}
      <a class="navbar-brand ms-2" href="#">User Dashboard</a>
      {% elif user.role.name == 'Manager' %}
      <a class="navbar-brand ms-2" href="#">Manager Dashboard</a>
      {% else %}
      <a class="navbar-brand ms-2" href="#">Admin Dashboard</a>
      {% endif %}
      <!-- Offcanvas menu -->
      <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasDarkNavbar" aria-labelledby="offcanvasDarkNavbarLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasDarkNavbarLabel">Dashboard</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <div class="offcanvas-body">
          <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="profile">Profile</a>
            </li>
            {% if user.role.name != "User" %}
            <li class="nav-item">
              <a class="nav-link" href="users">View Users</a>
            </li>
            {% endif %}
            <li class="nav-item">
              <a class="nav-link" href="tasks">View Tasks</a>
            </li>
          </ul>

        </div>
      </div>
      <div class="text-end">
            <a href="login" class="btn-danger">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Include Bootstrap JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
